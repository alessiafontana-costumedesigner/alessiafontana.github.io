  - title: Échec et Mat
    category: Fashion Concept
    subtitle: Costume concept · Thesis project
    year: "2022"
    description: The project draws inspiration from 17th-century Holland and the
      aesthetics of Flemish art, exploring their colours, textures, and
      compositional elements. It aims to celebrate traditional women’s
      craftsmanship, placing handmade lace and embroidery at its core as
      expressions of a rich artisanal heritage shaped by patience, precision,
      and sensitivity. By reinterpreting these techniques, the project seeks to
      bring renewed attention to a legacy of gestures and skills passed down
      through generations, transforming them into a contemporary design
      language.
    cover: /images/copertina-3.jpg
    cover_focus: center
