  - title: Fashion Graduate Italia
    category: Fashion show
    subtitle: "fashion "
    year: "2022"
    description: The collection combines damask, velvet, lace collars, and knitted
      bonnets. It celebrates traditional women’s craftsmanship, reinterpreting
      lace-making and embroidery through a contemporary design language. The
      collection was presented at Fashion Graduate Italia in Milan in 2022
