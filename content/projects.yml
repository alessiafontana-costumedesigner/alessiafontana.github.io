  - title: Costume Studies
    category: Costume Studies
    description: A collection of costume sketches exploring different historical
      periods, focusing on the evolution of clothing, silhouettes, fabrics, and
      decorative details. These studies investigate the relationship between
      fashion, history, and culture, offering a visual exploration of costume
      across different eras.
    cover: /images/0-1.jpg
