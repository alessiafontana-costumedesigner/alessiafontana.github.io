intro: >-
  My name is Alessia Fontana, and I am an Italian costume designer with a
  background in Fashion Design. My passion for cinema, art, and visual
  storytelling has always guided my creative journey.


  I am particularly interested in the relationship between costume, character,
  and narrative, and in the way clothing can convey emotions, reveal identities,
  and contribute to the atmosphere of a story.
text: >
  I graduated in Fashion Design from Modartech, Tuscany and later specialised in
  Costume Design at the Centro Sperimentale di Cinematografia in Rome. My work
  focuses on film and audiovisual productions, particularly short films, where I
  have gained experience as both a costume designer and a costume assistant.


  My approach combines visual and historical research with a focus on fabrics,
  colours, textures, and details that help define a character and support the
  narrative. I am particularly interested in hands-on techniques and textile
  experimentation, exploring how materials and craftsmanship can contribute to
  the storytelling process.


  *Collaborations & Availability*

  I'm available for costume department opportunities in film, television, and
  theatre. Open to projects in Italy and abroad.


  Languages: Italian (native), English (fluent).
